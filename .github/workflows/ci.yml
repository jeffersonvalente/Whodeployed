name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm version comes from "packageManager" in the root package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present run build
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run typecheck
      # Engine tests run with coverage thresholds (QC-1, vitest.config.ts).
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run validate
      # $CLI = node packages/engine/dist/cli/main.js, built by the step above (ADR-007).
      - name: Engine CLI checks (D-1, D-2, CLI-3, CLI-4, CLI-5, P-4)
        run: bash packages/engine/scripts/ci-engine.sh
      - name: Engine pack smoke (PUB-1, PUB-2)
        run: bash packages/engine/scripts/pack-smoke.sh
      # T1.29 (ADR-009): `pnpm --dir packages/engine pack --pack-destination dist/` after
      # pack-smoke.sh, on a dist/ with no .tgz; checks PUB-2 and the isolated install.
      - name: Engine tarball artifact (PUB-2, PUB-4 via CI artifact)
        run: bash packages/engine/scripts/pack-artifact.sh
      # Artifact name = whodeployed-engine-<version>, <version> read from packages/engine/package.json
      # at CI time (ADR-007 Emenda 3); fails unless the packed tarball carries that same version.
      - name: Engine package version
        id: engine-version
        run: |
          version="$(node -p "require('./packages/engine/package.json').version")"
          test -f "packages/engine/dist/whodeployed-engine-${version}.tgz"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      # Not a GitHub Release: the tarball is a workflow artifact only (ADR-009).
      - name: Upload engine tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: whodeployed-engine-${{ steps.engine-version.outputs.version }}
          path: packages/engine/dist/*.tgz
          if-no-files-found: error
