# Scenario template — copy to NN-your-slug.yaml and fill in.
# Full format and rules: SPEC.md §7 (format), §5 (levels), ADR-014 §2 (fields this phase adds).
# One fault, one lesson. Anonymize everything.
# Fields marked (required) must be present or the scenario loader rejects the file.
# Files whose name starts with "_" (like this one) are skipped when the loader reads the directory.

id: 00-template                      # (required) NN-kebab-slug, NN = order in the campaign
title: "Catalog pages failing"       # (required) what the player sees on the incident card
level: junior                        # (required) junior | pleno (senior has no repertoire yet)
teaches: "One sentence. The single thing the player should know afterwards."   # (required) no "and": two lessons = two scenarios
trap: "The misleading signal this scenario plants on purpose."                  # (required) a signal that points at the wrong place
seed: "template-01"                  # (required) any string; same seed => same telemetry
system: default-shop                 # service topology to simulate; only default-shop exists today

faults:                              # (required) exactly one in this phase
  - kind: service_crash_loop         # a FaultKind the engine knows (packages/engine/src/types.ts, ADR-004)
    target: catalog                  # always explicit; never rely on the catalog default
    startTick: 10                    # always explicit (1 tick = 10 s)
    params: { uptimeTicks: 1, restartTicks: 3 }   # always explicit; names and ranges in ADR-004

noise:                               # distractions; at least one from scenario #3 onwards
  - kind: deploy                     # deploy | config
    target: auth
    tick: 8
    note: "login page copy change"

alert:                               # (required) what pages the player; write it like a real monitor
  tick: 14                           # >= the fault's startTick; the session starts here
  text: "[FIRING] HighErrorRate gateway: 5xx > 5% for 2m"

# (required) Severity threshold, in impacted ticks (ADR-013).
# A tick is "impacted" when >= 5% of the user requests entering the system (gateway,
# orders-worker) fail, are lost, or take > 1 s (initial thresholds, ADR-013 §3).
# The clock shows accumulated impacted ticks; the incident is "severe" once that count
# reaches this budget. Noise alone never moves it. Integer >= 1.
# Calibrate it with the scenario's seed: with no player action, impact must reach the
# budget by tick alert.tick + 2 * impactBudget (FASE-2 EN-6b).
impactBudget: 60

referencePath:                       # (required) what a strong engineer would do, in order. Used only in the review.
  # Golden rule (SPEC §5): only questions and actions of this scenario's level.
  #   junior: { ask: dashboard, service: X }
  #           { ask: logs, service: X, window: 30 }      (window in ticks: 30 = last 5 min; no filter)
  #           { act: restart, target: X }
  #   pleno:  everything above, plus logs with filter, trace (percentile 50|95|99),
  #           whatChanged, compare by instance, { act: rollback, target: X }
  # Nothing else is playable yet: no NPCs, no last-week comparison, no flags, no scaling,
  # no escalation, no "declare mitigated" (senior items, phase 3). The path must reach an
  # effective mitigation (no impacted tick in the 30 ticks after the action) before impact
  # reaches the budget.
  - { ask: logs, service: catalog, window: 30 }
  - { act: restart, target: catalog }

rootCause: "One sentence, plain words."   # (required) never shown before the review

review:                              # (required) feeds the post-incident review (three sentences, no score)
  redundant: ["dashboard auth"]      # question patterns that add nothing here: "<kind>" or "<kind> <component>"
  keySignal: "which single signal already contained the answer"   # free text
  keySignalAsk: "logs catalog"       # pattern of the question whose answer contains keySignal
